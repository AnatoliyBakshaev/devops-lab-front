
server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/data {
        proxy_pass http://backend:8081/api/data;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
